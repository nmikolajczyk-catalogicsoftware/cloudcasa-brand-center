name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated files are up to date
        run: |
          python3 tools/build.py --check
          python3 tools/build_zips.py --check
      - name: Repository checks (links, assets, colours, markup)
        run: python3 tools/check.py
      - name: Browser tests (tabs, keyboard, hash routing)
        run: python3 tools/test_browser.py
